name: Sauvegarde de la base (chaque nuit)

# Greg, 26 octobre 2026 : « sauvegardes quotidiennes ; dis-moi si le plan Neon ne sauvegarde pas chaque jour ».
# Le plan Neon gratuit ne garde que 6 heures d'historique (retour à un instant donné), sans sauvegarde quotidienne.
# Ce workflow, gratuit, fait chaque nuit un export complet (pg_dump), chiffré (AES-256, clé de Greg), vérifié, gardé
# 30 jours comme artefact GitHub. Les deux secrets vivent dans l'ENVIRONNEMENT GitHub « sauvegarde », réservé à `main`
# (Settings → Environments), posés par Greg lui-même, jamais écrits ailleurs :
# - SAUVEGARDE_DATABASE_URL : l'adresse de connexion Neon DIRECTE (sans pooler) d'un rôle en LECTURE SEULE ;
# - SAUVEGARDE_CLE : la phrase de chiffrement (gardée hors de GitHub par Greg pour pouvoir déchiffrer).
# Restauration : docs/SECURITE.md, « Sauvegardes ». Un horaire GitHub ne part que depuis la branche par défaut (main).
# Revue du 1er novembre 2026 : la base est en PostgreSQL 18, un pg_dump plus ancien refuse de l'exporter : le client 18
# vient du dépôt officiel PostgreSQL ; un secret absent fait ÉCHOUER le job (plus de « vert » sans sauvegarde) ; l'export
# est relu (`pg_restore --list`) avant d'être chiffré, et son empreinte SHA-256 part avec lui.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: sauvegarde
    env:
      SAUVEGARDE_DATABASE_URL: ${{ secrets.SAUVEGARDE_DATABASE_URL }}
      SAUVEGARDE_CLE: ${{ secrets.SAUVEGARDE_CLE }}
    steps:
      - name: Secrets posés ?
        run: |
          if [ -z "$SAUVEGARDE_DATABASE_URL" ] || [ -z "$SAUVEGARDE_CLE" ]; then
            echo "::error::Secrets absents dans l'environnement « sauvegarde » : AUCUNE sauvegarde faite."
            exit 1
          fi
      - name: Client PostgreSQL 18
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get -qq install -y postgresql-client-18 >/dev/null
          /usr/lib/postgresql/18/bin/pg_dump --version
      - name: Export, vérification et chiffrement
        run: |
          set -euo pipefail
          PGBIN=/usr/lib/postgresql/18/bin
          NOM="base-$(date -u +%Y-%m-%d).dump"
          "$PGBIN/pg_dump" --format=custom --no-owner --no-privileges "$SAUVEGARDE_DATABASE_URL" > "$NOM"
          # L'export se relit : sa table des matières doit lister des tables et la table des migrations.
          "$PGBIN/pg_restore" --list "$NOM" > sommaire.txt
          TABLES=$(grep -c " TABLE DATA " sommaire.txt || true)
          grep -q "_prisma_migrations" sommaire.txt || { echo "::error::Export illisible ou incomplet."; exit 1; }
          rm sommaire.txt
          if [ "$TABLES" -lt 10 ]; then echo "::error::Export trop petit ($TABLES tables)."; exit 1; fi
          echo "Tables exportées : $TABLES ; taille : $(stat -c %s "$NOM") octets."
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$NOM" -out "$NOM.enc" -pass env:SAUVEGARDE_CLE
          rm "$NOM"
          sha256sum "$NOM.enc" > "$NOM.enc.sha256"
          cat "$NOM.enc.sha256"
          echo "NOM=$NOM.enc" >> "$GITHUB_ENV"
      - name: Garder 30 jours
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOM }}
          path: |
            ${{ env.NOM }}
            ${{ env.NOM }}.sha256
          retention-days: 30
          if-no-files-found: error
