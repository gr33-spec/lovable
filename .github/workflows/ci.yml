name: CI BatiClair

# Uniquement l'application BatiClair (dossier baticlair/).
# patrimoine/ est une autre application, non concernée.
on:
  pull_request:
    paths: ["baticlair/**", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["baticlair/**", ".github/workflows/ci.yml"]

defaults:
  run:
    working-directory: baticlair

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baticlair_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baticlair_test
      # `prisma generate` (postinstall) lit la config ; aucune connexion n'est ouverte.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baticlair_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: baticlair/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: baticlair/.nvmrc
          cache: pnpm
          cache-dependency-path: baticlair/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test build

  e2e:
    name: Parcours de bout en bout (téléphone + ordinateur, passe ${{ matrix.passe }})
    runs-on: ubuntu-latest
    # Les deux passes (mois, puis lots) frôlaient 20 minutes depuis la passe UI/UX ; la passe lots a son propre travail.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        passe: [mois, lots]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baticlair_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baticlair_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baticlair_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: baticlair/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: baticlair/.nvmrc
          cache: pnpm
          cache-dependency-path: baticlair/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @baticlair/web exec playwright install --with-deps chromium
      # L'API tourne depuis ses sources (tsx) : ses paquets internes doivent être compilés.
      - run: pnpm turbo run build --filter=@baticlair/web --filter='@baticlair/api^...'
      - if: matrix.passe == 'mois'
        run: pnpm --filter @baticlair/web e2e
      # Commande commune du mois (Greg, 22 octobre 2026) : l'ancien regroupement par lot (`COMMANDE_COMMUNE=lots`) garde
      # ses parcours, dans une passe à lui ; la passe par défaut les saute en le disant.
      - if: matrix.passe == 'lots'
        run: pnpm --filter @baticlair/web e2e --grep @lots
        env:
          E2E_COMMANDE_COMMUNE: lots
